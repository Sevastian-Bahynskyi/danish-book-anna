name: Upload Danish audio to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-danish-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/feat/azure-jeppe-audio-generator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upload recordings
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-audio-to-supabase.mjs
