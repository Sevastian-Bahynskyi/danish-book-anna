<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Практична данська для роботи. Created by Anna Melnykova." />

    <!-- Installable app (Android / desktop) -->
    <link rel="manifest" href="/danish-book-anna/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/danish-book-anna/favicon-32.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FCF0F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D1517" media="(prefers-color-scheme: dark)" />

    <!-- Chrome/Edge/Samsung offer their own install dialog. Keep it for the app's
         «Встановити» button (it can arrive before the app has loaded). -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__dpaInstall = e;
        window.dispatchEvent(new Event('dpa-install'));
      });
    </script>

    <!-- iPhone / iPad: "Add to Home Screen" opens full screen with this icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/danish-book-anna/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dansk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #fcf0f1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1d1517;
        }
      }
      /* The app scrolls inside <ScrollView>, not the page. */
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Щоб відкрити книжку, увімкніть JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
